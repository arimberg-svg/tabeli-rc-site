<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Аналитика по должностям — У Михалыча</title>
  <meta name="description" content="Отдельная аналитика табелей Т-13 по каждой должности РЦ и логистики." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #4208a8;
      --primary-bright: #5b21d6;
      --primary-soft: rgba(66, 8, 168, 0.1);
      --bg: #f7f4ff;
      --stroke: rgba(66, 8, 168, 0.14);
      --text: #1a1033;
      --muted: #5c5278;
      --muted-2: #7a7196;
      --radius: 16px;
      --font: "Manrope", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", monospace;
      --shadow: 0 10px 28px rgba(66, 8, 168, 0.06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
    }
    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 480px at 12% -10%, rgba(66, 8, 168, 0.14), transparent 60%),
        radial-gradient(700px 420px at 92% 0%, rgba(107, 61, 255, 0.1), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, #f7f4ff 45%, #efe9ff 100%);
    }
    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .top {
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(14px);
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid var(--stroke);
    }
    .top-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 0;
    }
    .brand { display: inline-flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
    .brand-logo { height: 48px; width: auto; display: block; }
    .brand-tag {
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      border-left: 1px solid var(--stroke); padding-left: 14px;
    }
    .chip {
      display: inline-flex; align-items: center;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700;
      background: var(--primary-soft); color: var(--primary);
      border: 1px solid rgba(66, 8, 168, 0.22);
    }

    .hero { padding: 36px 0 12px; }
    .eyebrow {
      margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.12em;
      font-size: 12px; font-weight: 800; color: var(--primary);
    }
    .hero h1 {
      margin: 0 0 10px; font-size: clamp(26px, 4vw, 38px);
      line-height: 1.15; letter-spacing: -0.03em; color: var(--primary);
    }
    .lede { margin: 0; max-width: 56ch; color: var(--muted); font-size: 16px; }

    .pos-nav {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 18px 0 8px;
    }
    .pos-tab {
      appearance: none; border: 1px solid var(--stroke);
      background: #fff; color: var(--muted);
      font: inherit; font-weight: 700; font-size: 13px;
      padding: 10px 14px; border-radius: 999px; cursor: pointer;
      transition: .15s ease;
    }
    .pos-tab:hover { color: var(--primary); border-color: rgba(66,8,168,.35); }
    .pos-tab.active {
      color: #fff; background: var(--primary); border-color: transparent;
    }
    .pos-tab small {
      display: block; font-size: 11px; font-weight: 600; opacity: .8; margin-top: 2px;
    }
    .pos-tab.active small { opacity: .9; }

    .panel {
      background: rgba(255,255,255,.95);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin: 14px 0;
    }
    .panel-head { margin-bottom: 16px; }
    .panel-head h2 {
      margin: 0 0 6px; font-size: 22px; color: var(--primary); letter-spacing: -0.02em;
    }
    .panel-head p { margin: 0; color: var(--muted); font-size: 14px; }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    }
    .stat {
      background: linear-gradient(180deg, #fff, #f3efff);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px;
    }
    .stat-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .stat-value {
      font-size: clamp(20px, 2.2vw, 28px); font-weight: 800;
      color: var(--primary); letter-spacing: -0.03em; line-height: 1.2;
    }
    .stat-note { margin-top: 5px; font-size: 12px; color: var(--muted-2); }

    .bars { display: grid; gap: 10px; }
    .bar-row {
      display: grid; grid-template-columns: minmax(120px, 220px) 1fr 72px;
      gap: 12px; align-items: center;
    }
    .bar-label {
      font-size: 13px; font-weight: 600; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bar-track {
      height: 14px; border-radius: 999px;
      background: rgba(66,8,168,.08); overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #c4b5ff, #4208a8);
      transition: width .85s cubic-bezier(.2,.8,.2,1);
    }
    .bar-val {
      text-align: right; font-family: var(--mono);
      font-size: 13px; font-weight: 700; color: var(--primary);
    }

    .dual-grid { display: grid; gap: 10px; }
    .dual-row {
      display: grid; grid-template-columns: 56px 1fr 1fr; gap: 12px; align-items: center;
    }
    .dual-ym { font-size: 13px; font-weight: 800; color: var(--primary); }
    .dual-col { display: grid; gap: 4px; }
    .dual-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; font-weight: 700; color: var(--muted-2);
    }
    .dual-track {
      height: 10px; border-radius: 999px;
      background: rgba(66,8,168,.08); overflow: hidden;
    }
    .dual-fill {
      height: 100%; width: 0; border-radius: inherit;
      transition: width .85s cubic-bezier(.2,.8,.2,1);
    }
    .dual-fill.hours { background: linear-gradient(90deg, #9b87f5, #4208a8); }
    .dual-fill.sick { background: linear-gradient(90deg, #7c4dff, #4208a8); }
    .dual-fill.vac { background: linear-gradient(90deg, #c4b5ff, #9b87f5); }

    .legend-row {
      display: flex; gap: 16px; flex-wrap: wrap;
      margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .legend-row i {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 3px; margin-right: 6px; vertical-align: middle;
    }
    .lg-hours { background: #4208a8; }
    .lg-sick { background: #5b21d6; }
    .lg-vac { background: #9b87f5; }

    .split-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .subhead {
      margin: 0 0 12px; font-size: 15px; font-weight: 800; color: var(--primary);
    }
    .table-wrap {
      overflow: auto; border-radius: 14px;
      border: 1px solid var(--stroke); background: #fff;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 11px 12px; text-align: left; border-bottom: 1px solid var(--stroke); }
    th {
      background: #f0ebff; color: var(--primary);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800;
    }
    td.num, th.num {
      text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono);
    }
    tbody tr:hover { background: rgba(66,8,168,.04); }
    .empty {
      padding: 18px; color: var(--muted-2); font-size: 14px;
      border: 1px dashed var(--stroke); border-radius: 12px;
    }

    .foot {
      margin-top: 20px; padding: 28px 0 48px;
      border-top: 1px solid var(--stroke);
    }
    .foot-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .foot-logo { height: 34px; width: auto; display: block; }
    .foot p { margin: 0; color: var(--muted-2); font-size: 13px; }

    @media (max-width: 900px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .split-2 { grid-template-columns: 1fr; }
      .brand-tag { display: none; }
      .bar-row { grid-template-columns: 100px 1fr 60px; }
    }
    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr; }
      .brand-logo { height: 40px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#">
        <img class="brand-logo" src="assets/logo-umikhalycha.png" alt="У Михалыча" />
        <span class="brand-tag">РЦ и логистика</span>
      </a>
      <span class="chip" id="periodChip">…</span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">Табели Т-13 · аналитика по ролям</p>
      <h1>Отдельный разбор по каждой должности</h1>
      <p class="lede">Выберите должность — часы, невыходы и сотрудники только по этой роли.</p>
    </section>

    <nav class="pos-nav" id="posNav" aria-label="Должности"></nav>

    <section id="roleView"></section>
  </main>

  <footer class="foot">
    <div class="wrap foot-inner">
      <img class="foot-logo" src="assets/logo-umikhalycha.png" alt="" />
      <p>«У Михалыча» · табели Т-13 · аналитика по должностям</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const R = window.REPORT;
    document.getElementById("periodChip").textContent = R.period.replaceAll("-", ".");

    function fmtYm(ym) {
      const [y, m] = ym.split("-");
      return `${m}.${y.slice(2)}`;
    }

    function animateBars(root) {
      requestAnimationFrame(() => {
        (root || document).querySelectorAll("[data-w]").forEach((el) => {
          el.style.width = el.getAttribute("data-w") + "%";
        });
      });
    }

    const nav = document.getElementById("posNav");
    nav.innerHTML = R.nav
      .map(
        (n, i) => `<button type="button" class="pos-tab${i === 0 ? " active" : ""}" data-pos="${n.position}">
        ${n.label}
        <small>${n.people} чел. · ср. ${n.avg} ч</small>
      </button>`
      )
      .join("");

    function renderRole(posName) {
      const P = R.positions[posName];
      if (!P) return;

      const lead = P.people[0];
      const maxMonth = Math.max(...P.monthly.map((m) => m.avg_hours), 1);
      const maxLeave = Math.max(...P.monthly.flatMap((m) => [m.sick_days, m.vac_days]), 1);
      const maxPerson = Math.max(...P.people.map((p) => p.total_hours), 1);

      const peopleHours = P.people
        .map(
          (p) => `<div class="bar-row">
          <div class="bar-label" title="${p.name}">${p.name}</div>
          <div class="bar-track"><div class="bar-fill" data-w="${(100 * p.total_hours) / maxPerson}"></div></div>
          <div class="bar-val">${p.total_hours.toLocaleString("ru-RU")}</div>
        </div>`
        )
        .join("");

      const monthHours = P.monthly
        .map(
          (m) => `<div class="bar-row">
          <div class="bar-label">${fmtYm(m.ym)} · ${m.people} чел.</div>
          <div class="bar-track"><div class="bar-fill" data-w="${(100 * m.avg_hours) / maxMonth}"></div></div>
          <div class="bar-val">${m.avg_hours} ч</div>
        </div>`
        )
        .join("");

      const leaveDual = P.monthly
        .map(
          (m) => `<div class="dual-row">
          <div class="dual-ym">${fmtYm(m.ym)}</div>
          <div class="dual-col">
            <div class="dual-meta"><span>Больн.</span><span>${m.sick_days}</span></div>
            <div class="dual-track"><div class="dual-fill sick" data-w="${(100 * m.sick_days) / maxLeave}"></div></div>
          </div>
          <div class="dual-col">
            <div class="dual-meta"><span>Отпуск</span><span>${m.vac_days}</span></div>
            <div class="dual-track"><div class="dual-fill vac" data-w="${(100 * m.vac_days) / maxLeave}"></div></div>
          </div>
        </div>`
        )
        .join("");

      const sickRows = P.top_sick.length
        ? P.top_sick
            .map(
              (p) => `<tr>
              <td>${p.name}</td>
              <td class="num">${p.sick_days}</td>
              <td class="num">${p.months}</td>
            </tr>`
            )
            .join("")
        : "";

      const vacRows = P.top_vac.length
        ? P.top_vac
            .map(
              (p) => `<tr>
              <td>${p.name}</td>
              <td class="num">${p.vac_days}</td>
              <td class="num">${p.months}</td>
            </tr>`
            )
            .join("")
        : "";

      document.getElementById("roleView").innerHTML = `
        <div class="panel">
          <div class="panel-head">
            <h2>${P.label}</h2>
            <p>Только эта должность · ${P.people_count} сотрудник(ов) · ${P.person_months} человеко-месяцев</p>
          </div>
          <div class="stats">
            <article class="stat">
              <div class="stat-label">Средние часы / мес</div>
              <div class="stat-value">${P.avg_hours}</div>
              <div class="stat-note">медиана ${P.median_hours} ч</div>
            </article>
            <article class="stat">
              <div class="stat-label">Всего часов за период</div>
              <div class="stat-value">${P.total_hours.toLocaleString("ru-RU")}</div>
              <div class="stat-note">${P.people_count} чел. в роли</div>
            </article>
            <article class="stat">
              <div class="stat-label">Больничные</div>
              <div class="stat-value">${P.sick_days} дн.</div>
              <div class="stat-note">${P.top_sick.length ? "лидер: " + P.top_sick[0].name : "без отметок Б/Т"}</div>
            </article>
            <article class="stat">
              <div class="stat-label">Отпуска</div>
              <div class="stat-value">${P.vac_days} дн.</div>
              <div class="stat-note">${P.top_vac.length ? "лидер: " + P.top_vac[0].name : "без отметок ОТ"}</div>
            </article>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Часы по месяцам — ${P.label}</h2>
            <p>Среднее на сотрудника этой должности в каждом месяце</p>
          </div>
          <div class="bars">${monthHours}</div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Сотрудники — ${P.label}</h2>
            <p>Кто сколько отработал за весь период${lead ? ". Лидер: " + lead.name + " — " + lead.total_hours.toLocaleString("ru-RU") + " ч" : ""}</p>
          </div>
          <div class="bars">${peopleHours || '<div class="empty">Нет сотрудников в выборке</div>'}</div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Невыходы — ${P.label}</h2>
            <p>Больничные и отпуска только по этой должности</p>
          </div>
          <div class="legend-row">
            <span><i class="lg-sick"></i>Больничные</span>
            <span><i class="lg-vac"></i>Отпуска</span>
          </div>
          <div class="dual-grid">${leaveDual}</div>
          <div class="split-2" style="margin-top:18px">
            <div>
              <h3 class="subhead">Больничные по людям</h3>
              ${
                sickRows
                  ? `<div class="table-wrap"><table>
                      <thead><tr><th>ФИО</th><th class="num">Дней</th><th class="num">Мес.</th></tr></thead>
                      <tbody>${sickRows}</tbody>
                    </table></div>`
                  : `<div class="empty">Больничных по этой должности не было</div>`
              }
            </div>
            <div>
              <h3 class="subhead">Отпуска по людям</h3>
              ${
                vacRows
                  ? `<div class="table-wrap"><table>
                      <thead><tr><th>ФИО</th><th class="num">Дней</th><th class="num">Мес.</th></tr></thead>
                      <tbody>${vacRows}</tbody>
                    </table></div>`
                  : `<div class="empty">Отпусков по этой должности не было</div>`
              }
            </div>
          </div>
        </div>
      `;

      animateBars(document.getElementById("roleView"));
    }

    nav.addEventListener("click", (e) => {
      const btn = e.target.closest(".pos-tab");
      if (!btn) return;
      nav.querySelectorAll(".pos-tab").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      renderRole(btn.dataset.pos);
      window.scrollTo({ top: nav.offsetTop - 8, behavior: "smooth" });
    });

    renderRole(R.nav[0].position);
  </script>
</body>
</html>
